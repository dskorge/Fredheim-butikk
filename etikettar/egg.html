<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eggetikettar A4 · Fredheim gard</title>
<style>
/* Ark: 21 etikettar à 63,5 × 38,1 mm (Avery L7160 / Herma 4677 eller tilsvarande) */
@page { size: A4; margin: 0; }
:root { --brun: #5C4433; --papir: #F3ECDB; --sand: #CDB89C; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--papir); color: #2b1f17; font-family: 'Instrument Sans', Arial, sans-serif; }
.panel { max-width: 210mm; margin: 0 auto; padding: 16px 0; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.panel h1 { flex-basis: 100%; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; margin: 0; }
.panel p { flex-basis: 100%; margin: 0; font-size: 14px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
input, select { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid #b9ad9a; background: #fff; min-height: 44px; width: 150px; }
button { min-height: 46px; padding: 10px 18px; border: 2px solid var(--brun); background: var(--brun); color: var(--papir); font: inherit; font-weight: 600; cursor: pointer; }
.ark { width: 210mm; height: 297mm; margin: 0 auto 20px; background: #fff; position: relative; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
.et { position: absolute; width: 63.5mm; height: 38.1mm; line-height: 0; }
.ark.hjelp .et { outline: 0.2mm dashed #c9bfae; }
.et svg { display: block; width: 63.5mm; height: 38.1mm; }
@media print { body { background: #fff; } .panel { display: none; } .ark { margin: 0; box-shadow: none; } .ark.hjelp .et { outline: none; } }
</style>
</head>
<body>
<div class="panel">
  <h1>Eggetikettar på A4</h1>
  <p>Skriv ut i 100 % utan marg-skalering, på etikettark med 21 etikettar à 63,5 × 38,1 mm. Same QR-kode på alle: kassa reknar pris frå hyllekoden.</p>
  <label>Pakning<select id="type"><option value="egg12">12 stk (kartong)</option><option value="egg30">30 stk (brett)</option></select></label>
  <label>Pris (kr)<input id="pris" type="number" min="1" step="1" value="65"></label>
  <label>Best før<input id="best" type="date"></label>
  <label>Minste nettovekt (g)<input id="min" type="number" min="0" step="10" placeholder="tom = sorterte"></label>
  <label>Tal etikettar<input id="tal" type="number" min="1" max="21" value="21"></label>
  <button type="button" onclick="window.print()">Skriv ut</button>
</div>
<div class="ark hjelp" id="ark"></div>
<script src="../src/qr.min.js"></script>
<script src="fjell.js"></script>
<script src="maler.js"></script>
<script>
(function () {
  var E = window.FH_ETIKETT, $ = function (s) { return document.querySelector(s); };
  var base = new URL('../', location.href).href;
  var q = new URLSearchParams(location.search); if (q.get('base')) base = q.get('base');
  // L7160: toppmarg 15,15 mm, sidemarg 7,25 mm, 3 kolonnar (avstand 66,04 mm), 7 rader (38,1 mm)
  var TOPP = 15.15, SIDE = 7.25, KOL = 66.04, RAD = 38.1;
  function iso(d) { return d.toISOString().slice(0, 10); }
  var d0 = new Date(); d0.setDate(d0.getDate() + 28); $('#best').value = q.get('best') || iso(d0);
  if (q.get('min')) $('#min').value = q.get('min');
  $('#type').addEventListener('change', function () { $('#pris').value = $('#type').value === 'egg30' ? 150 : 65; teikn(); });
  function teikn() {
    var type = $('#type').value, n = Math.min(21, Math.max(1, +$('#tal').value || 21));
    var et = E.egg({ tal: type === 'egg30' ? 30 : 12, pris: +$('#pris').value, bestFor: $('#best').value, minVekt: +$('#min').value || 0, kode: E.hylleKode(base, type) });
    var h = '';
    for (var i = 0; i < n; i++) {
      var r = Math.floor(i / 3), k = i % 3;
      h += '<div class="et" style="left:' + (SIDE + k * KOL) + 'mm;top:' + (TOPP + r * RAD) + 'mm">' + et.svg + '</div>';
    }
    $('#ark').innerHTML = h;
  }
  document.querySelectorAll('input,select').forEach(function (el) { el.addEventListener('input', teikn); });
  E.lastFontCss('fonts/').then(function () { teikn(); document.body.dataset.klar = '1'; });
})();
</script>
</body>
</html>
